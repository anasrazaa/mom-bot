# ─────────────────────────────────────────────────────────────────────────────
# GIK Faculty MoM Assistant – Docker Compose
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── LLM backend (Ollama) ───────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: mom_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Ollama model puller (runs once, then exits) ────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: mom_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "
        ollama pull ${LLM_MODEL:-qwen2.5:14b} &&
        echo 'Model pulled successfully'
      "
    restart: "no"

  # ── FastAPI MoM application ────────────────────────────────────────────────
  mom-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mom_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./data:/app/data                      # meeting data + exports
      - ./models:/app/models                  # whisper + pyannote + speechbrain
      - hf_cache:/root/.cache/huggingface     # HuggingFace model cache
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:14b}
      - PYANNOTE_HF_TOKEN=${PYANNOTE_HF_TOKEN}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  ollama_models:
    driver: local
  hf_cache:
    driver: local
